Quest-dependent terrain detection is off (game function signature not found): affected zones are cached by scene content and are not rebuilt automatically when quest progress changes terrain within the same zone; use /vnav rebuild if needed.==任務進度相關地形偵測已停用（找不到遊戲函式特徵碼）：受影響的區域改以場景內容快取導航網格，同一區域內任務進度改變地形時不會自動重建，必要時請用 /vnav rebuild。
Cosmic exploration construction stage tracking is off (address not found): custom links are gated by scene detection and endpoint checks only.==宇宙探索建設階段追蹤已停用（找不到位址）：自訂捷徑只依場景偵測與端點預檢把關。
Jumping while following a path is off (action address not found): the character may get stuck where a jump is needed.==跟隨路徑時的跳躍已停用（找不到技能位址）：需要跳躍的地方角色可能會卡住。
AFK timer reset while following a path is off (address not found): the game may set you to AFK during long automated trips.==跟隨路徑時的閒置計時器重置已停用（找不到位址）：長時間自動移動時遊戲可能把你設為「離開」狀態。
Waypoint and debug overlay is off (camera address not found).==路徑點與除錯疊加顯示已停用（找不到鏡頭位址）。
Find shorter ground paths==地面尋路找更短的路
Ground paths are also searched with two more accurate methods, and the shortest valid result is used. The chosen route is never longer than the previous method's, at the cost of a little extra computation per search. When the destination cannot be reached, the path heads for the closest reachable point right away instead of searching the whole area first. Turn this off to use only the previous method. Flying paths are not affected.==地面尋路時另外用兩種較準確的方法再找一次，採用其中最短而且合法的那條；換上的路線不會比舊算法長，代價是每次尋路多花一點計算時間。終點走不到時，直接走向離終點最近的可達點，不再先把整個區域搜完。關閉＝只用舊算法。飛行路線不受影響。
Faster flying path search==飛行尋路加速
Flying paths are searched with a faster method: line-of-sight checks are deferred until they are needed, and the search is steered more directly toward the destination. Long flights that used to take several seconds to plan usually take well under a second now; the route may be slightly longer (usually under 1%, at most a few percent). When the destination is sealed off, the path still ends at the closest point found, after the same number of search steps as before but in less time. Turn this off to use only the previous method. Ground paths are not affected.==飛行路線改用較快的搜尋：視線檢查留到真正需要時才做，搜尋也更直接朝終點前進。以往要算好幾秒的長距離飛行，現在通常不到一秒；路線可能略長一點（通常不到 1%，最多幾個百分點）。終點被封住時，一樣停在找到的最近點，搜尋步數上限不變但花的時間較短。關閉＝只用舊算法。地面路線不受影響。
Rasterization: Cell Size (#cs)==光柵化：格子大小（Cell Size，#cs）
The xz-plane cell size to use for fields. [Limit: > 0] [Units: world]\n\nThe voxelization cell size #cs defines the voxel size along both axes of\nthe ground plane: x and z in Recast. This value is usually derived from the\ncharacter radius `r`. A recommended starting value for #cs is either `r/2`\nor `r/3`. Smaller values of #cs will increase rasterization resolution and\nnavmesh detail, but total generation time will increase exponentially.  In\noutdoor environments, `r/2` is often good enough.  For indoor scenes with\ntight spaces you might want the extra precision, so a value of `r/3` or\nsmaller may give better results.\n\nThe initial instinct is to reduce this value to something very close to zero\nto maximize the detail of the generated navmesh. This quickly becomes a case\nof diminishing returns, however. Beyond a certain point there's usually not\nmuch perceptable difference in the generated navmesh, but huge increases in\ngeneration time.  This hinders your ability to quickly iterate on level\ndesigns and provides little benefit.  The general recommendation here is to\nuse as large a value for #cs as you can get away with.\n\n#cs and #ch define voxel/grid/cell size.  So their values have significant\nside effects on all parameters defined in voxel units.\n\nThe minimum value for this parameter depends on the platform's floating point\naccuracy, with the practical minimum usually around 0.05.==用於各種場（field）的 xz 平面格子大小。[限制：> 0] [單位：world]\n\n體素化（voxelization）的格子大小 #cs 決定地面平面兩個軸（Recast 中的 x 與 z）上的體素（voxel）大小。這個值通常由角色半徑 `r` 推得，建議的起始值是 `r/2` 或 `r/3`。#cs 越小，光柵化（rasterization）的解析度與導航網格細節越高，但總產生時間會呈指數增加。戶外環境通常 `r/2` 就夠；室內空間狹窄時可能需要更高的精度，`r/3` 或更小的值效果可能較好。\n\n直覺上會想把這個值調到非常接近 0，讓產生的導航網格細節最多，但這很快就會邊際效益遞減：超過某個程度後，產生的導航網格通常看不出什麼差別，產生時間卻大幅增加，不利於快速反覆調整關卡設計，好處也不多。一般建議是在可接受的範圍內，#cs 盡量取大。\n\n#cs 與 #ch 定義了體素／網格／格子的大小，因此它們的值會大幅影響所有以體素為單位的參數。\n\n這個參數的最小值取決於平台的浮點數精度，實務上的下限通常約為 0.05。
Rasterization: Cell Height (#ch)==光柵化：格子高度（Cell Height，#ch）
The y-axis cell size to use for fields. [Limit: > 0] [Units: world]\n\nThe voxelization cell height #ch is defined separately in order to allow for\ngreater precision in height tests. A good starting point for #ch is half the\n#cs value. Smaller #ch values ensure that the navmesh properly connects areas\nthat are only separated by a small curb or ditch.  If small holes are generated\nin your navmesh around where there are discontinuities in height (for example,\nstairs or curbs), you may want to decrease the cell height value to increase\nthe vertical rasterization precision of Recast.\n\n#cs and #ch define voxel/grid/cell size.  So their values have significant\nside effects on all parameters defined in voxel units.\n\nThe minimum value for this parameter depends on the platform's floating point\naccuracy, with the practical minimum usually around 0.05.==用於各種場（field）的 y 軸格子大小。[限制：> 0] [單位：world]\n\n體素化的格子高度 #ch 與 #cs 分開定義，好讓高度判定更精確。#ch 不錯的起始值是 #cs 的一半。#ch 越小，越能確保只隔著小路緣或小溝的區域在導航網格上正確相連。如果導航網格在高度不連續的地方（例如樓梯或路緣）附近出現小破洞，可以調小格子高度，提高 Recast 垂直方向的光柵化精度。\n\n#cs 與 #ch 定義了體素／網格／格子的大小，因此它們的值會大幅影響所有以體素為單位的參數。\n\n這個參數的最小值取決於平台的浮點數精度，實務上的下限通常約為 0.05。
Agent: Height==代理：高度（Agent Height）
Minimum floor to 'ceiling' height that will still allow the floor area to be considered walkable. [Limit: >= 3 * CellHeight] [Units: world]\n\nThis value defines the worldspace height `h` of the agent in voxels. The value\nof #walkableHeight should be calculated as `ceil(h / ch)`.  Note this is based\non #ch not #cs since it's a height value.\n\nPermits detection of overhangs in the source geometry that make the geometry\nbelow un-walkable. The value is usually set to the maximum agent height.==地板到「天花板」之間至少要有多高，該處地板才仍被視為可行走。[限制：>= 3 * CellHeight] [單位：world]\n\n這個值以體素數定義代理（agent）在世界空間中的高度 `h`。#walkableHeight 應以 `ceil(h / ch)` 計算。注意這是高度值，所以用 #ch 而不是 #cs。\n\n可用來偵測來源幾何中的懸垂結構，讓其下方的幾何變成不可行走。這個值通常設為代理的最大高度。
Agent: Radius==代理：半徑（Agent Radius）
The distance to erode/shrink the walkable area of the heightfield away from obstructions. [Limit: >= 0] [Units: world]\n\nThe parameter #walkableRadius defines the worldspace agent radius `r` in voxels.\nMost often, this value of #walkableRadius should be calculated as `ceil(r / cs)`.\nNote this is based on #cs since the agent radius is always parallel to the ground\nplane.\n\nIf the #walkableRadius value is greater than zero, the edges of the navmesh will\nbe pushed away from all obstacles by this amount.\n\nA non-zero #walkableRadius allows for much simpler runtime navmesh collision checks.\nThe game only needs to check that the center point of the agent is contained within\na navmesh polygon.  Without this erosion, runtime navigation checks need to collide\nthe geometric projection of the agent's logical cylinder onto the navmesh with the\nboundary edges of the navmesh polygons.\n\nIn general, this is the closest any part of the final mesh should get to an\nobstruction in the source geometry.  It is usually set to the maximum\nagent radius.\n\nIf you want to have tight-fitting navmesh, or want to reuse the same navmesh for\nmultiple agents with differing radii, you can use a `walkableRadius` value of zero.\nBe advised though that you will need to perform your own collisions with the navmesh\nedges, and odd edge cases issues in the mesh generation can potentially occur.  For\nthese reasons, specifying a radius of zero is allowed but is not recommended.==可行走區域從障礙物往內侵蝕／縮小的距離。[限制：>= 0] [單位：world]\n\n參數 #walkableRadius 以體素數定義代理在世界空間中的半徑 `r`。多數情況下 #walkableRadius 應以 `ceil(r / cs)` 計算。注意代理半徑一定與地面平行，所以用 #cs。\n\n如果 #walkableRadius 大於 0，導航網格的邊緣會以這個距離從所有障礙物往內推。\n\n非 0 的 #walkableRadius 能讓執行期的導航網格碰撞檢查簡單得多：遊戲只需要檢查代理的中心點是否位於某個導航網格多邊形內。沒有這層侵蝕的話，執行期的導航檢查就必須拿代理邏輯圓柱在導航網格上的投影，去和導航網格多邊形的邊界邊做碰撞。\n\n一般來說，這是最終網格的任何部分最靠近來源幾何中障礙物的距離，通常設為代理的最大半徑。\n\n如果想要緊貼障礙物的導航網格，或想讓半徑不同的多個代理共用同一份導航網格，可以把 `walkableRadius` 設為 0。但要注意，這樣就得自己處理與導航網格邊緣的碰撞，而且網格產生時可能出現奇怪的邊緣情況。因此半徑設為 0 雖然允許，但不建議。
Agent: Max Climb==代理：最大攀爬高度（Max Climb）
Maximum ledge height that is considered to still be traversable. [Limit: >= 0] [Units: world]\n\nThe #walkableClimb value defines the maximum height of ledges and steps that\nthe agent can walk up. Given a designer-defined `maxClimb` distance in world\nunits, the value of #walkableClimb should be calculated as `ceil(maxClimb / ch)`.\nNote that this is using #ch not #cs because it's a height-based value.\n\nAllows the mesh to flow over low lying obstructions such as curbs and\nup/down stairways. The value is usually set to how far up/down an agent can step.==仍視為可通過的最大台階高度。[限制：>= 0] [單位：world]\n\n#walkableClimb 定義代理能走上去的台階與階梯的最大高度。給定設計者以世界單位定義的 `maxClimb` 距離時，#walkableClimb 應以 `ceil(maxClimb / ch)` 計算。注意這是以高度為準的值，所以用 #ch 而不是 #cs。\n\n讓網格能越過路緣等低矮障礙，並沿著樓梯上下延伸。這個值通常設為代理一步能跨上／跨下的高度。
Agent: Max Slope==代理：最大坡度（Max Slope）
The maximum slope that is considered walkable. [Limits: 0 <= value < 90] [Units: Degrees]\n\nThe parameter #walkableSlopeAngle is to filter out areas of the world where\nthe ground slope would be too steep for an agent to traverse. This value is\ndefined as a maximum angle in degrees that the surface normal of a polgyon\ncan differ from the world's up vector.  This value must be within the range\n`[0, 90]`.\n\nThe practical upper limit for this parameter is usually around 85 degrees.==仍視為可行走的最大坡度。[限制：0 <= value < 90] [單位：Degrees]\n\n參數 #walkableSlopeAngle 用來濾除地面坡度太陡、代理無法通過的區域。它定義為多邊形表面法線與世界向上向量之間允許的最大夾角（度）。這個值必須在 `[0, 90]` 範圍內。\n\n實務上這個參數的上限通常約為 85 度。
Filtering==過濾（Filtering）
Select which filtering passes to apply to voxelized geometry to remove some classes of artifacts.==選擇要對體素化後的幾何套用哪些過濾步驟，以去除某些類型的瑕疵。
Region: Min Size==區域：最小尺寸（Min Size）
The minimum number of cells allowed to form isolated island areas. [Limit: >= 0] [Units: voxels]\n\nWatershed partitioning is really prone to noise in the input distance field.\nIn order to get nicer areas, the areas are merged and small disconnected areas\nare removed after the water shed partitioning. The parameter #minRegionArea\ndescribes the minimum isolated region size that is still kept. A region is\nremoved if the number of voxels in the region is less than the square of\n#minRegionArea.\n\nAny regions that are smaller than this area will be marked as unwalkable.\nThis is useful in removing useless regions that can sometimes form on\ngeometry such as table tops, box tops, etc.==允許形成孤立島狀區域的最少格子數。[限制：>= 0] [單位：voxels]\n\n分水嶺分割對輸入的距離場雜訊非常敏感。為了得到較好的區域，分水嶺分割之後會合併區域並移除小的不相連區域。參數 #minRegionArea 描述仍會保留的最小孤立區域大小：區域內的體素數少於 #minRegionArea 的平方時，該區域會被移除。\n\n小於這個面積的區域都會標成不可行走。這可以移除有時會在桌面、箱頂等幾何上形成的無用區域。
Region: Merge Size==區域：合併尺寸（Merge Size）
Any regions with a span count smaller than this value will, if possible, be merged with larger regions. [Limit: >=0] [Units: voxels]\n\nThe triangulation process works best with small, localized voxel regions.\nThe parameter #mergeRegionArea controls the maximum voxel area of a region\nthat is allowed to be merged with another region.  If you see small patches\nmissing here and there, you could lower the #minRegionArea value.==區段（span）數小於這個值的區域，會盡可能與較大的區域合併。[限制：>=0] [單位：voxels]\n\n三角化在小而局部的體素區域上效果最好。參數 #mergeRegionArea 控制一個區域可以與其他區域合併的最大體素面積。如果到處看到缺了一小塊一小塊，可以調低 #minRegionArea 的值。
Partitioning algorithm==分割演算法（Partitioning）
There are 3 martitioning methods, each with some pros and cons.==共有 3 種分割方式，各有優缺點。
Polygonization: Max Edge Length==多邊形化：最大邊長（Max Edge Length）
The maximum allowed length for contour edges along the border of the mesh. [Limit: >= 0] [Units: world]\n\nIn certain cases, long outer edges may decrease the quality of the resulting\ntriangulation, creating very long thin triangles. This can sometimes be\nremedied by limiting the maximum edge length, causing the problematic long\nedges to be broken up into smaller segments.\n\nThe parameter #maxEdgeLen defines the maximum edge length and is defined in\nterms of voxels. A good value for #maxEdgeLen is something like\n`walkableRadius * 8`. A good way to adjust this value is to first set it really\nhigh and see if your data creates long edges. If it does, decrease #maxEdgeLen\nuntil you find the largest value which improves the resulting tesselation.\n\nExtra vertices will be inserted as needed to keep contour edges below this\nlength. A value of zero effectively disables this feature.==網格邊界上輪廓邊允許的最大長度。[限制：>= 0] [單位：world]\n\n某些情況下，過長的外緣會降低三角化結果的品質，產生又長又細的三角形。限制最大邊長有時可以改善，讓有問題的長邊被切成較短的線段。\n\n參數 #maxEdgeLen 定義最大邊長，以體素為單位。#maxEdgeLen 不錯的值大約是 `walkableRadius * 8`。調整這個值的好方法是先設得很高，看看資料會不會產生長邊；如果會，就逐步調低 #maxEdgeLen，直到找到能改善鑲嵌（tessellation）結果的最大值。\n\n需要時會插入額外的頂點，讓輪廓邊保持在這個長度以下。設為 0 等於停用這項功能。
Polygonization: Max Edge Simplification Error==多邊形化：邊緣簡化最大誤差（Max Simplification Error）
The maximum distance a simplfied contour's border edges should deviate from the original raw contour. [Limit: >=0] [Units: voxels]\n\nWhen the rasterized areas are converted back to a vectorized representation,\nthe #maxSimplificationError describes how loosely the simplification is done.\nThe simplification process uses the Ramer–Douglas-Peucker algorithm,\nand this value describes the max deviation in voxels.\n\nGood values for #maxSimplificationError are in the range `[1.1, 1.5]`.\nA value of `1.3` is a good starting point and usually yields good results.\nIf the value is less than `1.1`, some sawtoothing starts to appear at the\ngenerated edges.  If the value is more than `1.5`, the mesh simplification\nstarts to cut some corners it shouldn't.\n\nThe effect of this parameter only applies to the xz-plane.==簡化後輪廓的邊界邊與原始輪廓之間允許的最大偏差距離。[限制：>=0] [單位：voxels]\n\n把光柵化的區域轉回向量表示時，#maxSimplificationError 決定簡化得多寬鬆。簡化使用 Ramer–Douglas-Peucker 演算法，這個值就是以體素為單位的最大偏差。\n\n#maxSimplificationError 的建議範圍是 `[1.1, 1.5]`。`1.3` 是不錯的起點，通常效果很好。小於 `1.1` 時，產生的邊緣開始出現鋸齒；大於 `1.5` 時，網格簡化開始切掉不該切的角。\n\n這個參數只影響 xz 平面。
Polygonization: Max Vertices per Polygon==多邊形化：每個多邊形的最多頂點數（Max Vertices per Polygon）
The maximum number of vertices allowed for polygons generated during the contour to polygon conversion process. [Limit: >= 3]\n\nIf the mesh data is to be used to construct a Detour navigation mesh, then the upper limit\nis limited to <= #DT_VERTS_PER_POLYGON.==在輪廓轉多邊形的過程中，產生的多邊形允許的最多頂點數。[限制：>= 3]\n\n如果網格資料要用來建構 Detour 導航網格，上限必須 <= #DT_VERTS_PER_POLYGON。
Detail Mesh: Sample Distance==細節網格：取樣距離（Sample Distance）
Sampling distance to use when generating the detail mesh. [Limits: 0 or >= 0.9] [Units: voxels]==產生細節網格時使用的取樣距離。[限制：0 或 >= 0.9] [單位：voxels]
Detail Mesh: Max Sample Error==細節網格：取樣最大誤差（Max Sample Error）
The maximum distance the detail mesh surface should deviate from heightfield data. (For height detail only.) [Limit: >= 0] [Units: world]==細節網格表面與高度場資料之間允許的最大偏差距離（只影響高度細節）。[限制：>= 0] [單位：world]
L1 Tile count==第一層圖塊數（L1 Tile count）
Number of tiles per axis for first-level subdivision. Has to be power-of-2. [Limit: 1 <= value <= 32]\nAffects both navmesh and nav volume.==第一層細分每個軸的圖塊數，必須是 2 的冪次。[限制：1 <= value <= 32]\n同時影響導航網格與飛行用的導航體積（nav volume）。
L2 Tile count==第二層圖塊數（L2 Tile count）
Number of tiles per axis for second-level subdivision. Has to be power-of-2. [Limit: 1 <= value <= 32]\nAffects only nav volume.==第二層細分每個軸的圖塊數，必須是 2 的冪次。[限制：1 <= value <= 32]\n只影響導航體積。
L3 Voxel count==第三層體素數（L3 Voxel count）
Number of leaf voxels per axis per tile. Has to be power-of-2. [Limit: 1 <= value <= 32]\nAffects only nav volume.==每個圖塊每個軸的葉體素數，必須是 2 的冪次。[限制：1 <= value <= 32]\n只影響導航體積。
Ground tolerance==地面容許值（Ground tolerance）
Undocumented==（無說明）
Climb down distance==攀降距離（Climb down distance）
Horizontal distance for edge climb samples.==邊緣攀降取樣的水平距離。
Climb down max height==攀降最大高度（Climb down max height）
Climb down min height==攀降最小高度（Climb down min height）
Edge jump end distance==跳降落點距離（Edge jump end distance）
Edge jump height==跳降高度（Edge jump height）
Edge jump max drop==跳降最大落差（Edge jump max drop）
Edge jump min drop==跳降最小落差（Edge jump min drop）
Low-hanging obstacles==低矮障礙物（Low-hanging obstacles）
Marks non-walkable spans as walkable if their maximum is within #walkableClimb of the span below them.\n\nThis removes small obstacles and rasterization artifacts that the agent would be able to walk over\nsuch as curbs.  It also allows agents to move up terraced structures like stairs.\n\nObstacle spans are marked walkable if: obstacleSpan.smax - walkableSpan.smax < walkableClimb==若不可行走區段的頂端與其下方可行走區段頂端的差距在 #walkableClimb 以內，就把它標成可行走。\n\n這會移除代理能直接走過去的小障礙物與光柵化瑕疵（例如路緣），也讓代理能走上樓梯之類的階梯狀結構。\n\n障礙區段標成可行走的條件：obstacleSpan.smax - walkableSpan.smax < walkableClimb
Ledge spans==懸崖邊區段（Ledge spans）
Marks spans that are ledges as not-walkable.\n\nA ledge is a span with one or more neighbors whose maximum is further away than #walkableClimb\nfrom the current span's maximum.\nThis method removes the impact of the overestimation of conservative voxelization \nso the resulting mesh will not have regions hanging in the air over ledges.\n\nA span is a ledge if: abs(currentSpan.smax - neighborSpan.smax) > walkableClimb==把位於懸崖邊的區段標成不可行走。\n\n懸崖邊（ledge）指的是某個區段有一個以上的相鄰區段，其頂端與目前區段頂端的距離超過 #walkableClimb。\n這個步驟可以消除保守體素化高估所造成的影響，讓產生的網格不會在懸崖邊外出現懸空的區域。\n\n區段是懸崖邊的條件：abs(currentSpan.smax - neighborSpan.smax) > walkableClimb
Walkable low-height spans==淨空不足的可走區段（Walkable low-height spans）
Marks walkable spans as not walkable if the clearance above the span is less than the specified #walkableHeight.\n\nFor this filter, the clearance above the span is the distance from the span's \nmaximum to the minimum of the next higher span in the same column.\nIf there is no higher span in the column, the clearance is computed as the\ndistance from the top of the span to the maximum heightfield height.==若可行走區段上方的淨空小於指定的 #walkableHeight，就把它標成不可行走。\n\n這個過濾器所說的淨空，是從區段頂端到同一欄中上一個較高區段底端的距離。\n如果該欄沒有更高的區段，淨空就是從區段頂端到高度場最大高度的距離。
Interiors==封閉幾何內部（Interiors）
Marks spans inside manifold geometry (or below non-manifold) as non-walkable.==把封閉（manifold）幾何內部（或非封閉幾何下方）的區段標成不可行走。
Watershed==分水嶺（Watershed）
Watershed partitioning:\n - the classic Recast partitioning\n - creates the nicest tessellation\n - usually slowest\n - partitions the heightfield into nice regions without holes or overlaps\n - the are some corner cases where this method creates produces holes and overlaps\n    - holes may appear when a small obstacles is close to large open area (triangulation can handle this)\n    - overlaps may occur if you have narrow spiral corridors (i.e stairs), this make triangulation to fail\nGenerally the best choice if you precompute the nacmesh, use this if you have large open areas.==分水嶺分割：\n - Recast 經典的分割方式\n - 產生最漂亮的鑲嵌結果\n - 通常最慢\n - 把高度場分割成沒有破洞也不重疊的漂亮區域\n - 少數邊緣情況下這個方法仍會產生破洞與重疊\n    - 小障礙物靠近大片空地時可能出現破洞（三角化可以處理）\n    - 狹窄的螺旋通道（例如樓梯）可能產生重疊，導致三角化失敗\n如果導航網格是預先算好的，這通常是最佳選擇；有大片空地時用這個。
Monotone==單調（Monotone）
Monotone partitioning:\n - fastest\n - partitions the heightfield into regions without holes and overlaps (guaranteed)\n - creates long thin polygons, which sometimes causes paths with detours\nUse this if you want fast navmesh generation.==單調分割：\n - 最快\n - 把高度場分割成沒有破洞也不重疊的區域（保證）\n - 產生又長又細的多邊形，有時會讓路徑繞遠路\n想要快速產生導航網格時用這個。
Layer==分層（Layer）
Layer partitioning\n - quite fast\n - partitions the heighfield into non-overlapping regions\n - relies on the triangulation code to cope with holes (thus slower than monotone partitioning)\n - produces better triangles than monotone partitioning\n - does not have the corner cases of watershed partitioning\n - can be slow and create a bit ugly tessellation (still better than monotone)\n   if you have large open areas with small obstacles (not a problem if you use tiles)\nGood choice to use for tiled navmesh with medium and small sized tiles.==分層分割：\n - 相當快\n - 把高度場分割成互不重疊的區域\n - 靠三角化程式處理破洞（所以比單調分割慢）\n - 產生的三角形比單調分割好\n - 沒有分水嶺分割的那些邊緣情況\n - 有大片空地夾雜小障礙物時可能很慢，鑲嵌結果也有點醜（仍比單調分割好）\n   （使用圖塊時不是問題）\n適合中小型圖塊的分塊導航網格。
None==無
Navmesh properties==導航網格屬性
Support flying==支援飛行
Load existing territory customization==載入此區域既有的自訂設定
Rebuild navmesh==重建導航網格
Rebuild scene extract only==只重新擷取場景
Builds the current zone with the Navmesh properties above, for debugging: the result replaces the loaded mesh but is not written to the cache.\nFor a normal rebuild of the current zone, use Rebuild on the Navmesh manager tab.==以上方「導航網格屬性」的參數建置目前區域（偵錯用）：結果會取代目前載入的網格，但不寫入快取。\n一般重建目前區域請用「導航網格管理器」分頁的「重建」。
Keep intermediates (debug)==保留中間資料（偵錯用）
When ticked, the next rebuild keeps every tile's heightfields, contours and polygon meshes so they can be inspected under Intermediates below. On large zones this takes several GB of extra memory and slows the build down; the data stays in memory until the next rebuild or plugin reload.\nLeave it off for a normal build: the resulting navmesh is the same either way.==勾選後，下次重建會保留每個圖塊的高度場、輪廓與多邊形網格，供下方「中間資料」逐塊檢視。大地圖會多用數 GB 記憶體、建置也會變慢，這些資料會一直留在記憶體裡，直到下次重建或插件重新載入。\n一般建置不用勾：建出來的導航網格兩者相同。
State: NotBuilt==狀態：尚未建置
State: InProgress==狀態：建置中
State: Failed==狀態：建置失敗
State: Ready==狀態：已完成
Pathfind==尋路
Player tile: ??x??==玩家所在圖塊：??x??
Intermediates==中間資料（Intermediates）
This build did not keep per-tile intermediates. Tick "Keep intermediates (debug)" and rebuild to inspect individual tiles.==這次建置沒有保留各圖塊的中間資料；要逐塊檢視，請勾選「保留中間資料（偵錯用）」再重建。
Global==全部圖塊
Tile==圖塊
HF comparison==高度場比對（HF comparison）
Old: ??==舊版：??
New: ??==新版：??
Match: True==結果一致：是
Match: False==結果一致：否
Detour navmesh==Detour 導航網格
Loaded mesh replaced with custom build, check Navmesh Manager tab==已載入的網格已換成這次自訂建置的結果，請到「導航網格管理器」分頁查看
Reload==重新載入
Reloads the current zone's navmesh, reading the cache file if there is one.==重新載入目前區域的導航網格（有快取檔就直接讀快取）。
Rebuild==重建
Rebuilds the current zone's navmesh from scratch without reading the cache, then updates the cache file.==不讀快取、從頭重建目前區域的導航網格，並更新快取檔。
Tune flying path search==飛行尋路調校
Uses the three values below for flying path searches (from a community fork). On large maps a flight that took seconds to plan usually takes a fraction of that, and a destination that cannot be reached is given up on after about a quarter of a second instead of about four; the route is usually 2-3% longer, occasionally up to about a fifth. Meant to be used with faster flying path search on: with the previous method the route can now and then cut through the edge of a rock, which that method already does occasionally. Off = the search is unchanged and the values below are ignored. Ground paths are not affected.==飛行尋路改用下面三個值（取自社群改版）。大地圖上要算好幾秒的飛行通常只要其中一小部分的時間，終點根本到不了時約 0.25 秒就放棄（原本約 4 秒）；路線通常長 2～3%，個別最多長約兩成。請搭配「飛行尋路加速」一起開：搭配舊算法時，路線偶爾會切過岩壁邊角（舊算法本來就偶爾如此）。關閉＝搜尋不變，下面三個值都不使用。地面路線不受影響。
Pull toward the destination (heuristic weight)==朝終點的偏向（啟發式權重）
Higher = the search heads more directly for the destination and explores less, but the route may be longer. Without tuning the previous method uses 1 and the faster flying path search uses 1.1. Suggested: 1.5.==越高＝搜尋越直接朝終點前進、探索的範圍越小，但路線可能較長。不調校時舊算法用 1、飛行尋路加速用 1.1。建議值：1.5。
Line-of-sight check range during search (yalms)==搜尋中的視線檢查距離（米）
How far the search may look for a straight shortcut while it runs. 0 = no limit (what is used without tuning). A long check walks every voxel on the line, which is where much of the time goes. Suggested: 25.==搜尋進行中最遠可以找多長的直線捷徑。0＝不限（不調校時就是不限）。距離長的檢查要逐格走過整條線，是耗時的一大來源。建議值：25。
Search step limit==搜尋步數上限
How many steps the search may take before it stops at the closest point found. 1000000 = what is used without tuning. A destination that cannot be reached at all always runs to this limit. Suggested: 200000.==搜尋最多走幾步，用完就停在找到的最近點。1000000＝不調校時的值。終點完全到不了時一定會跑滿這個上限。建議值：200000。
When a flight cannot reach the destination, follow the walking route==飛行到不了終點時改沿步行路線飛
When a flying path search stops short of the destination (for example flying out of an underground area whose exit leads away from the destination), the walking navmesh is asked for a route and the flight follows it, low along the ground, one short search per leg. If that route cannot be followed either, the path is the same as with this off: it stops at the closest point found. Only runs after the flying search has already failed, and usually costs under a tenth of a second more in that case (rarely close to a second). Each use writes one line to the log. Off = unchanged.==飛行搜尋停在終點前時（例如從出口背向終點的地下區域飛出去），改向步行用的導航網格要一條路線，貼著地面一段一段沿它飛。那條路線也接不起來時，結果與關閉時相同：停在找到的最近點。只在飛行搜尋已經失敗後才執行，這種情況下通常多花不到 0.1 秒（少數接近 1 秒）。每次使用都會在 log 寫一行。關閉＝不變。
When the sky above is clear, climb first and fly over obstacles==上方淨空時先爬高、從障礙物上方飛過去
Flights first climb (at most 45 degrees) to a height that clears everything along the way, fly straight across in the air, and descend near the destination, keeping well away from trees, rocks and walls. The usual search is used instead when something is directly above the start or the destination (under a tree, a roof, inside a cave, or at the map's height limit), while diving, when the distance is too short to climb and come back down, or when this route would be too much longer than the usual one. Each use writes one line to the log. Off = unchanged.==飛行時先以 45 度以內的坡度爬到能越過沿途所有障礙物的高度，在空中直飛，接近終點再下降，離樹木、岩石與牆壁都遠遠的。起點或終點正上方被擋（樹下、屋簷下、洞穴裡、碰到地圖的高度上限）、潛水中、距離太短來不及爬升再下降，或這條路線比原本的路線長太多時，照原本的方式尋路。每次採用都會在 log 寫一行。關閉＝不變。
Clearance around the flight (yalms)==飛行時與周圍保持的距離（米）
While flying level, at least this much empty space is kept above, below and to both sides. Higher = flies higher and is less likely to scrape anything, but fewer flights can use the high route. Suggested: 10.==平飛時上下左右至少留這麼多米的空間。越大＝飛得越高、越不容易擦到東西，但能用高空路線的飛行越少。建議值：10。
Use it only if at most this much longer (%)==最多比原本的路線長多少才採用（%）
The high route is not used when it is more than this much longer than the usual route. When it is within this much of the straight-line distance it is used right away without running the usual search (so it cannot be more than this much longer than the usual route either). Suggested: 25.==高空路線比原本的路線長超過這個比例就不採用。高空路線不比直線距離長超過這個比例時，直接採用、不再跑原本的搜尋（因此一定也不會比原本的路線長超過這個比例）。建議值：25。
