The minimum speed, in yalms per second, the object must maintain to avoid being considered stuck.==物件必須維持的最低速度（米/秒），低於此值才會被視為卡住。
Speed below which you count as stuck, in yalms per second. Default 3 (about half of normal running speed). Values below ~0.5 mean the character has to be completely frozen before this triggers.==低於這個速度就算卡住，單位是米/秒。預設 3（大約是一般跑步速度的一半）。設成 0.5 以下等於要角色完全靜止不動才會觸發。
