Automatically load/build navigation data when changing zones==切換區域時自動載入/建立導航資料
Enable DTR bar==啟用 DTR 伺服器資訊列
Show detailed query status in DTR==在 DTR 中顯示詳細查詢狀態
Align camera to movement direction==將鏡頭對齊移動方向
Camera height (degrees)==鏡頭高度（角度）
Show active waypoints==顯示目前的路徑點
Always visualize game collision==永遠顯示遊戲碰撞範圍
Cancel current path on player movement input==玩家輸入移動時取消目前路徑
Stop pathing when stuck==卡住時停止導航
Max cores used during mesh build==建立導航網格時使用的最大核心數
0 = use all available; positive number = use that many cores; negative number = leave that many cores idle==0 = 使用所有可用核心；正數 = 使用該數量的核心；負數 = 保留該數量的核心不使用
Stuck tolerance (yalms/second)==卡住判定容許值（米/秒）
The minimum distance the object must move each frame to avoid being considered stuck.==物件每幀必須移動的最小距離，低於此值才會被視為卡住。
Stuck timeout (ms)==卡住逾時時間（毫秒）
How long you can remain under the stuck threshold before stopping.==在停止前，可維持在卡住判定閾值以下的時間長度。
Retry pathing after stop==停止後重試導航
If enabled, the agent will attempt to re-path after being considered stuck.==啟用後，代理程式在被判定為卡住之後將嘗試重新規劃路徑。
Randomness Multiplier==隨機性倍率
Navmesh==導航網格
Config==設定
Layout==版面配置
Collision==碰撞
Navmesh manager==導航網格管理器
Navmesh custom==自訂導航網格
