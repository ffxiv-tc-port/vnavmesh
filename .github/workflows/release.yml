name: Release

on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: /tmp/dalamud
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Get version from tag
        run: echo "version=$(echo ${{ github.ref_name }} | sed 's/^v//')" >> $GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Download Dalamud (TC pin)
        run: |
          wget https://github.com/ffxiv-tc-port/DalamudPluginsTC/releases/download/dalamud-pin-v13.0.0.16/dalamud-api13-net9.zip -O ${{ env.DALAMUD_HOME }}.zip
          unzip ${{ env.DALAMUD_HOME }}.zip -d ${{ env.DALAMUD_HOME }} || true

      - name: Restore Project
        run: dotnet restore vnavmesh/vnavmesh.csproj

      - name: Build Project
        run: |
          dotnet build --configuration Release vnavmesh/vnavmesh.csproj \
            -p:Version=${{ env.version }} \
            -p:AssemblyVersion=${{ env.version }} \
            -p:FileVersion=${{ env.version }}

      - name: write version into manifest
        run: |
          jq --arg v "${{ env.version }}" '.AssemblyVersion = $v' vnavmesh/vnavmesh.json > /tmp/vnavmesh.json
          mv /tmp/vnavmesh.json vnavmesh/vnavmesh.json

      - name: Zip artifact
        run: |
          cd vnavmesh/bin/Release/vnavmesh
          unzip -o latest.zip -d /tmp/vnavmesh-package
          cp vnavmesh.json /tmp/vnavmesh-package/vnavmesh.json
          cd /tmp/vnavmesh-package
          zip -r "$GITHUB_WORKSPACE/vnavmesh.zip" .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            vnavmesh.zip
            vnavmesh/vnavmesh.json
